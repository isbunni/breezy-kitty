# ── breezy-kitty ────────────────────────────────────────────
# Kitty terminal emulator config
# 
# Pro tip: drop your actual kitty.conf here.
# On a fresh machine: clone this repo and symlink:
#   ln -sf ~/breezy-kitty/kitty.conf ~/.config/kitty/kitty.conf
#
# Grab the real config from your existing machine and paste it in.
# ─────────────────────────────────────────────────────────────

# Font
font_family      JetBrains Mono
font_size        11.0

# Theme (default dark)
background       #1d2021
foreground       #ebdbb2
selection_background #504945
selection_foreground #ebdbb2

# Cursor
cursor           #ebdbb2
cursor_shape     block
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait  2.0
url_color        #83a598
url_style        curly

# Performance
repaint_delay    10
input_delay      3
sync_to_monitor  no

# Layout
window_padding_width 4
hide_window_decorations yes

# Tab bar
tab_bar_style    powerline
tab_bar_margin_width 4.0
tab_bar_edge     bottom
active_tab_foreground #1d2021
active_tab_background #d79921
inactive_tab_foreground #ebdbb2
inactive_tab_background #3c3836

# Shell
shell_integration enabled
